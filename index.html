function decode64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder().decode(a)}
function showView(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('view').srcdoc=decode64(pages[name]);try{history.replaceState(null,'','#'+name)}catch(e){}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
const start=location.hash.slice(1);showView(pages[start]?start:'card');
</script></body></html>
